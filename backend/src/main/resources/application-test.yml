spring:
  datasource:
    url: jdbc:h2:mem:skillbook_test;DB_CLOSE_DELAY=-1;MODE=POSTGRESQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:test-secret-for-jwt-signing-must-be-at-least-32-chars}
  expiration-ms: 86400000
