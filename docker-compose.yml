services:
  postgres:
    image: postgres:16-alpine
    container_name: skillbook-db
    environment:
      POSTGRES_DB: skillbook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillbook"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: